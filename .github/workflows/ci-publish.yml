name: publish

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: build site
        run: |
          set -eu
          # Exercise the same script and pinned image both publish paths use,
          # so a change that only breaks the real build cannot pass here.
          mkdir -p public/cv
          echo build-sentinel > public/cv/dmitryv-cv.pdf
          inode_before=$(stat -c %i public)
          # The image runs as uid 1000, but the runner owns the workspace,
          # so hand the container the caller's ids or it cannot write.
          docker compose run --rm -T --user "$(id -u):$(id -g)" build
          inode_after=$(stat -c %i public)
          if [ "$inode_before" != "$inode_after" ]; then
            echo "public/ was replaced instead of refilled; nginx bind mounts that directory" >&2
            exit 1
          fi
          if [ "$(cat public/cv/dmitryv-cv.pdf)" != "build-sentinel" ]; then
            echo "public/cv was not preserved across the build" >&2
            exit 1
          fi
          if [ ! -s public/index.html ]; then
            echo "no home page produced" >&2
            exit 1
          fi

      - name: Russian pages link to pages that exist
        run: |
          set -eu
          # Menu URLs in hugo.json already carry their own language prefix, so
          # running them through absLangURL prefixed the shared /cv/ and the
          # English entry a second time on every Russian page.
          grep -q "href=https://terrty.net/cv/>" public/ru/index.html \
            || { echo "Russian menu no longer links to /cv/" >&2; exit 1; }
          grep -q "href=https://terrty.net/>in English<" public/ru/index.html \
            || { echo "Russian menu no longer links to / for English" >&2; exit 1; }
          grep -q "href=https://terrty.net/ru/>" public/index.html \
            || { echo "English menu no longer links to /ru/" >&2; exit 1; }
          # Russian posts used to link to root paths that only exist under /ru/.
          python3 - <<'PY'
          import os, re, sys
          bad = []
          for d, _, fs in os.walk("public/ru"):
              for f in fs:
                  if f != "index.html":
                      continue
                  p = os.path.join(d, f)
                  html = open(p, encoding="utf-8", errors="replace").read()
                  for m in re.finditer(r'href=(?:")?(/[^"\s>]*)', html):
                      u = m.group(1).split("#")[0].split("?")[0]
                      if not re.match(r"^/(ru/)?(19|20)\d\d/|^/(ru/)?tags/", u):
                          continue
                      if not any(os.path.exists(c) for c in
                                 (os.path.join("public", u.lstrip("/"), "index.html"),
                                  os.path.join("public", u.lstrip("/")))):
                          bad.append((os.path.relpath(p, "public"), u))
          for page, u in bad:
              print(f"{page} links to {u}, which is not generated", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      - name: a failed build must leave the served tree alone
        run: |
          set -eu
          # build.sh promises this, but it holds only because Hugo runs before
          # public/ is touched. Put a failing hugo first on PATH and check that
          # the tree the server would be serving comes through unchanged.
          echo failed-build-sentinel > public/index.html
          mkdir -p "$RUNNER_TEMP/failing-hugo"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/failing-hugo/hugo"
          chmod +x "$RUNNER_TEMP/failing-hugo/hugo"
          if PATH="$RUNNER_TEMP/failing-hugo:$PATH" ./build.sh; then
            echo "build.sh reported success with a hugo that always fails" >&2
            exit 1
          fi
          if [ "$(cat public/index.html)" != "failed-build-sentinel" ]; then
            echo "a failed build modified the served tree" >&2
            exit 1
          fi

  publish:
    name: Rebuild blog pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: remote push to https://terrty.net/ from master
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: curl -sSf --retry 3 "https://hooks.terrty.net/update/publish-blog/${UPDATER_KEY}"
