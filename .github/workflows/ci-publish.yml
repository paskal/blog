name: publish

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: build site
        run: |
          set -eu
          # Exercise the same script and pinned image both publish paths use,
          # so a change that only breaks the real build cannot pass here.
          mkdir -p public/cv
          echo build-sentinel > public/cv/dmitryv-cv.pdf
          inode_before=$(stat -c %i public)
          # The image runs as uid 1000, but the runner owns the workspace,
          # so hand the container the caller's ids or it cannot write.
          docker compose run --rm -T --user "$(id -u):$(id -g)" build
          inode_after=$(stat -c %i public)
          if [ "$inode_before" != "$inode_after" ]; then
            echo "public/ was replaced instead of refilled; nginx bind mounts that directory" >&2
            exit 1
          fi
          if [ "$(cat public/cv/dmitryv-cv.pdf)" != "build-sentinel" ]; then
            echo "public/cv was not preserved across the build" >&2
            exit 1
          fi
          if [ ! -s public/index.html ]; then
            echo "no home page produced" >&2
            exit 1
          fi

      - name: sitemaps and feeds stay scoped
        run: |
          set -eu
          # The sitemap must not advertise a page this same build marks noindex.
          # Checking the rendered pages rather than a list of known paths means a
          # future section or taxonomy cannot leak in unnoticed.
          for f in public/en/sitemap.xml public/ru/sitemap.xml; do
            grep -q "<loc>" "$f" || { echo "$f lists nothing at all" >&2; exit 1; }
            grep -o "<loc>[^<]*</loc>" "$f" | sed "s|<loc>https://terrty.net/||; s|</loc>||" | while read -r path; do
              page="public/${path}index.html"
              [ -f "$page" ] || continue
              if grep -q "name=robots content=\"noindex" "$page"; then
                echo "$f lists $path, which renders noindex" >&2
                exit 1
              fi
            done
          done
          grep -q "<loc>https://terrty.net/</loc>" public/en/sitemap.xml \
            || { echo "English sitemap lost the home page" >&2; exit 1; }
          grep -q "<loc>https://terrty.net/ru/</loc>" public/ru/sitemap.xml \
            || { echo "Russian sitemap lost the home page" >&2; exit 1; }
          # Feeds carry posts only, so no zero pubDate, and one enclosure at most.
          # Records split on </item> so the count survives minification.
          for f in public/index.xml public/ru/index.xml; do
            grep -q "<item>" "$f" || { echo "$f has no items" >&2; exit 1; }
            if grep -o "<pubDate>[^<]*</pubDate>" "$f" | grep -q " 0001 "; then
              echo "$f carries an item with a zero publication date" >&2
              exit 1
            fi
            max=$(awk 'BEGIN{RS="</item>"; m=0} {n=gsub(/<enclosure/,"&"); if(n>m)m=n} END{print m+0}' "$f")
            if [ "$max" -gt 1 ]; then
              echo "$f has an item carrying $max enclosures" >&2
              exit 1
            fi
          done

      - name: a failed build must leave the served tree alone
        run: |
          set -eu
          # build.sh promises this, but it holds only because Hugo runs before
          # public/ is touched. Put a failing hugo first on PATH and check that
          # the tree the server would be serving comes through unchanged.
          echo failed-build-sentinel > public/index.html
          mkdir -p "$RUNNER_TEMP/failing-hugo"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/failing-hugo/hugo"
          chmod +x "$RUNNER_TEMP/failing-hugo/hugo"
          if PATH="$RUNNER_TEMP/failing-hugo:$PATH" ./build.sh; then
            echo "build.sh reported success with a hugo that always fails" >&2
            exit 1
          fi
          if [ "$(cat public/index.html)" != "failed-build-sentinel" ]; then
            echo "a failed build modified the served tree" >&2
            exit 1
          fi

  publish:
    name: Rebuild blog pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: remote push to https://terrty.net/ from master
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: curl -sSf --retry 3 "https://hooks.terrty.net/update/publish-blog/${UPDATER_KEY}"
