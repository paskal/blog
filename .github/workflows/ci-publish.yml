name: publish

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: build site
        run: |
          set -eu
          # Exercise the same script and pinned image both publish paths use,
          # so a change that only breaks the real build cannot pass here.
          mkdir -p public/cv
          echo build-sentinel > public/cv/dmitryv-cv.pdf
          inode_before=$(stat -c %i public)
          # The image runs as uid 1000, but the runner owns the workspace,
          # so hand the container the caller's ids or it cannot write.
          docker compose run --rm -T --user "$(id -u):$(id -g)" build
          inode_after=$(stat -c %i public)
          if [ "$inode_before" != "$inode_after" ]; then
            echo "public/ was replaced instead of refilled; nginx bind mounts that directory" >&2
            exit 1
          fi
          if [ "$(cat public/cv/dmitryv-cv.pdf)" != "build-sentinel" ]; then
            echo "public/cv was not preserved across the build" >&2
            exit 1
          fi
          if [ ! -s public/index.html ]; then
            echo "no home page produced" >&2
            exit 1
          fi

      - name: a failed build must leave the served tree alone
        run: |
          set -eu
          # build.sh promises this, but it holds only because Hugo runs before
          # public/ is touched. Put a failing hugo first on PATH and check that
          # the tree the server would be serving comes through unchanged.
          echo failed-build-sentinel > public/index.html
          mkdir -p "$RUNNER_TEMP/failing-hugo"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/failing-hugo/hugo"
          chmod +x "$RUNNER_TEMP/failing-hugo/hugo"
          if PATH="$RUNNER_TEMP/failing-hugo:$PATH" ./build.sh; then
            echo "build.sh reported success with a hugo that always fails" >&2
            exit 1
          fi
          if [ "$(cat public/index.html)" != "failed-build-sentinel" ]; then
            echo "a failed build modified the served tree" >&2
            exit 1
          fi

  publish:
    name: Rebuild blog pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: remote push to https://terrty.net/ from master
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: curl -sSf --retry 3 "https://hooks.terrty.net/update/publish-blog/${UPDATER_KEY}"
